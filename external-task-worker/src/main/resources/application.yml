spring:
  application:
    name: external-task-worker

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

worker:
  camunda-base-url: ${WORKER_CAMUNDA_BASE_URL:http://localhost:8080/engine-rest}
  worker-id: ${WORKER_ID:order-external-task-worker}
  async-response-timeout: ${WORKER_ASYNC_RESPONSE_TIMEOUT:20s}
  lock-duration: ${WORKER_LOCK_DURATION:1m}
  default-retries: ${WORKER_DEFAULT_RETRIES:3}
  retry-timeout: ${WORKER_RETRY_TIMEOUT:30s}
  subscriptions-enabled: ${WORKER_SUBSCRIPTIONS_ENABLED:true}

inventory:
  service:
    base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8082}

payment:
  service:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}

shipping:
  service:
    base-url: ${SHIPPING_SERVICE_BASE_URL:http://localhost:8084}

order:
  service:
    base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8081}
