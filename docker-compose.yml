x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=docker
  OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
  OTEL_INSTRUMENTATION_HTTP_SERVER_EXCLUDED_URLS: /actuator/.*,/prometheus,/favicon.ico,/error,/camunda/app/.*,/camunda/api/.*,/webjars/.*,/.*\.(css|js|png|ico|map|woff|woff2)

services:
  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:latest}
    container_name: orchestration-camunda-sample-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317"

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    container_name: orchestration-camunda-sample-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./infrastructure/monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      jaeger:
        condition: service_started

  postgres:
    image: postgres:11-alpine
    container_name: orchestration-camunda-sample-postgres
    environment:
      POSTGRES_DB: workflow_service
      POSTGRES_USER: camunda
      POSTGRES_PASSWORD: camunda
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camunda -d workflow_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres11-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

  workflow-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: workflow-service
    image: camunda-order/workflow-service:local
    container_name: orchestration-camunda-sample-workflow-service
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: workflow-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workflow_service
      SPRING_DATASOURCE_USERNAME: camunda
      SPRING_DATASOURCE_PASSWORD: camunda
      INVENTORY_SERVICE_BASE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_BASE_URL: http://payment-service:8083
      SHIPPING_SERVICE_BASE_URL: http://shipping-service:8084
      INVOICE_SERVICE_BASE_URL: http://invoice-service:8085
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8086
      ORDER_SERVICE_BASE_URL: http://order-service:8081
    ports:
      - "${WORKFLOW_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    image: camunda-order/order-service:local
    container_name: orchestration-camunda-sample-order-service
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: order-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_service
      SPRING_DATASOURCE_USERNAME: camunda
      SPRING_DATASOURCE_PASSWORD: camunda
      WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8080
    ports:
      - "${ORDER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  inventory-service:
